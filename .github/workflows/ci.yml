name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly, so a sibling's change that breaks this repository shows the next morning
  # rather than at the next push here (and the downstream job below runs against the
  # siblings' newest main).  The seven repositories' crons are staggered: ooxml-common
  # 02:07, ooxml-edit 02:17, pptx2svg 02:37, docx2svg 02:47, pptx-agent 03:07, docx-agent
  # 03:17, xlsx-agent 03:27 (UTC).  The whole matrix, as a push runs it.
  schedule:
    - cron: "7 2 * * *"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # 3.15.0 is out (2026-10-09) but setup-python's version list may still offer only
          # its release candidates; this takes a final release whenever there is one, so
          # it changes nothing for 3.10 to 3.14.
          allow-prereleases: true

      - name: Install
        # The font bundle is the pptx2svg-fonts distribution, which lives in the pptx2svg
        # repository and is not on PyPI, so it is installed from there by URL rather than
        # resolved by name.  Only the tests that check the tables against the files need
        # it; they skip without it.
        #
        # ooxml-edit is test only, never a dependency (ooxml-common never imports it; it
        # depends on this package, from 0.64.0): with it installed, tests/test_dates.py and
        # tests/test_numfmt.py check that it reads this package's tables and codes instead
        # of skipping.  This checkout is installed first, so its requirement is met.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip install "pptx2svg-fonts @ git+https://github.com/uvrt/pptx2svg@main#subdirectory=packages/pptx2svg-fonts"
          python -m pip install "ooxml-edit @ git+https://github.com/uvrt/ooxml-edit@main"

      - name: Test
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12') }}
        run: python -m pytest -q

      # One leg runs the same suite under coverage instead, and fails when this package's
      # own tests cover less of it than the floor: the suite is meant to hold this package
      # by itself, not through pptx2svg's (the downstream job runs that one).  sysmon is
      # coverage's low-overhead core on Python 3.12 and later.  pyproject.toml's
      # [tool.coverage] says what is measured; raise the floor as the number rises.
      - name: Test, with coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        env:
          COVERAGE_CORE: sysmon
        run: |
          python -m pip install "coverage>=7.6"
          python -m coverage run -m pytest -q
          python -m coverage report --fail-under=86 --sort=cover

  # The renderers' suites against this change.  They exercise ooxml-common far more than
  # its own tests do, so a change that breaks pptx2svg or docx2svg fails here, on its own
  # pull request, instead of at the sibling's next push.  Each sibling is its main, with
  # this checkout installed (editable) before it so its `ooxml-common` requirement is
  # already met; one Linux leg on one Python, the sibling's default run (docx2svg's
  # without --run-slow, serial as its CI runs it).  A change a sibling must follow is red
  # here until the sibling's matching pull request (its CI pointed at this branch, as its
  # comment says) is merged right after this one.
  downstream:
    name: downstream (${{ matrix.sibling }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sibling: [pptx2svg, docx2svg]

    steps:
      - uses: actions/checkout@v4
        with:
          path: ooxml-common

      - uses: actions/checkout@v4
        with:
          repository: uvrt/${{ matrix.sibling }}
          ref: main
          path: ${{ matrix.sibling }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./ooxml-common
          python -m pip install -e "./${{ matrix.sibling }}[dev]"

      # As each sibling's own CI installs them: pptx2svg's font bundle from its checkout,
      # docx2svg's open substitute fonts from the distribution.
      - name: Install the font bundle (pptx2svg)
        if: matrix.sibling == 'pptx2svg'
        run: python -m pip install -e ./pptx2svg/packages/pptx2svg-fonts
      - name: Install the open substitute fonts (docx2svg)
        if: matrix.sibling == 'docx2svg'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation

      - name: The ooxml-common under test is this checkout
        run: |
          python - <<'PY'
          import pathlib, sys
          import ooxml_common
          here = pathlib.Path("ooxml-common/src").resolve()
          path = pathlib.Path(ooxml_common.__file__).resolve()
          print("ooxml-common from", path)
          sys.exit(0 if here in path.parents else f"expected ooxml-common from {here}")
          PY

      - name: Test ${{ matrix.sibling }}
        working-directory: ${{ matrix.sibling }}
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyproject.toml's version, and __version__, must be the one CHANGELOG.md's top
      # version section names: the tag workflow tags that version when it reaches main.
      - name: The version agrees with CHANGELOG.md
        run: python tools/check_version.py
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
